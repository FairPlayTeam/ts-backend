services:
  backend:
    build:
      context: .
      target: combined
    image: fairplay-backend:local
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      RUNTIME_ROLE: ${RUNTIME_ROLE:-combined}
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-fairplay}?schema=public
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      JSON_BODY_LIMIT_BYTES: ${JSON_BODY_LIMIT_BYTES:-1048576}
      SESSION_CLEANUP_INTERVAL_MINUTES: ${SESSION_CLEANUP_INTERVAL_MINUTES:-60}
      SESSION_CLEANUP_INACTIVE_RETENTION_DAYS: ${SESSION_CLEANUP_INACTIVE_RETENTION_DAYS:-30}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:-local-compose-rate-limit-secret-7f4d2c1b9a8063e5}
      AUTH_CODE_PEPPER: ${AUTH_CODE_PEPPER:-local-compose-auth-code-pepper-4f9e1a7b2c8d0e6f}
      FOLLOWING_CURSOR_ENCRYPTION_KEY: ${FOLLOWING_CURSOR_ENCRYPTION_KEY:-78c1c8d89b9982db066232c742118a9dd8263a8f0671f840a88f45c595c45d8f}
      OBJECT_STORAGE_ENDPOINT: ${COMPOSE_OBJECT_STORAGE_ENDPOINT:-http://object-storage:3900}
      OBJECT_STORAGE_PUBLIC_URL: ${COMPOSE_OBJECT_STORAGE_PUBLIC_URL:-http://localhost:9000}
      OBJECT_STORAGE_REGION: ${COMPOSE_OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${COMPOSE_OBJECT_STORAGE_BUCKET:-user-media}
      OBJECT_STORAGE_ACCESS_KEY: ${COMPOSE_OBJECT_STORAGE_ACCESS_KEY:-fairplay}
      OBJECT_STORAGE_SECRET_KEY: ${COMPOSE_OBJECT_STORAGE_SECRET_KEY:-fairplay-local-secret}
      OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS: ${COMPOSE_OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS:-900}
      OBJECT_STORAGE_TIMEOUT_MS: ${OBJECT_STORAGE_TIMEOUT_MS:-5000}
      PROFILE_MEDIA_MAX_UPLOAD_BYTES: ${PROFILE_MEDIA_MAX_UPLOAD_BYTES:-3145728}
      VIDEO_OBJECT_STORAGE_BUCKET: ${VIDEO_OBJECT_STORAGE_BUCKET:-videos}
      VIDEO_UPLOAD_PART_SIZE_BYTES: ${VIDEO_UPLOAD_PART_SIZE_BYTES:-67108864}
      VIDEO_UPLOAD_MAX_PARTS: ${VIDEO_UPLOAD_MAX_PARTS:-10000}
      VIDEO_UPLOAD_MAX_BYTES: ${VIDEO_UPLOAD_MAX_BYTES:-3221225472}
      VIDEO_USER_STORAGE_QUOTA_BYTES: ${VIDEO_USER_STORAGE_QUOTA_BYTES:-107374182400}
      VIDEO_UPLOAD_SESSION_TTL_SECONDS: ${VIDEO_UPLOAD_SESSION_TTL_SECONDS:-86400}
      VIDEO_UPLOAD_IDLE_TTL_SECONDS: ${VIDEO_UPLOAD_IDLE_TTL_SECONDS:-900}
      VIDEO_UPLOAD_MAX_RESERVATIONS_PER_HOUR: ${VIDEO_UPLOAD_MAX_RESERVATIONS_PER_HOUR:-2}
      VIDEO_TRANSCODE_MAX_OUTSTANDING_JOBS: ${VIDEO_TRANSCODE_MAX_OUTSTANDING_JOBS:-10}
      VIDEO_TRANSCODE_MAX_OUTSTANDING_JOBS_PER_USER: ${VIDEO_TRANSCODE_MAX_OUTSTANDING_JOBS_PER_USER:-2}
      VIDEO_TRANSCODE_MAX_CONCURRENT_JOBS: ${VIDEO_TRANSCODE_MAX_CONCURRENT_JOBS:-1}
      VIDEO_TRANSCODE_THREADS_PER_JOB: ${VIDEO_TRANSCODE_THREADS_PER_JOB:-2}
      VIDEO_TRANSCODE_MAX_DURATION_SECONDS: ${VIDEO_TRANSCODE_MAX_DURATION_SECONDS:-1800}
      VIDEO_TRANSCODE_MAX_WIDTH: ${VIDEO_TRANSCODE_MAX_WIDTH:-3840}
      VIDEO_TRANSCODE_MAX_HEIGHT: ${VIDEO_TRANSCODE_MAX_HEIGHT:-3840}
      VIDEO_TRANSCODE_MAX_PIXELS: ${VIDEO_TRANSCODE_MAX_PIXELS:-8294400}
      VIDEO_TRANSCODE_MAX_ASPECT_RATIO: ${VIDEO_TRANSCODE_MAX_ASPECT_RATIO:-4}
      VIDEO_TRANSCODE_MAX_FPS: ${VIDEO_TRANSCODE_MAX_FPS:-30}
      VIDEO_TRANSCODE_FFPROBE_TIMEOUT_MS: ${VIDEO_TRANSCODE_FFPROBE_TIMEOUT_MS:-30000}
      VIDEO_TRANSCODE_FFMPEG_TIMEOUT_MS: ${VIDEO_TRANSCODE_FFMPEG_TIMEOUT_MS:-7200000}
      VIDEO_TRANSCODE_MAX_ARTIFACT_BYTES: ${VIDEO_TRANSCODE_MAX_ARTIFACT_BYTES:-4294967296}
    ports:
      - '${BACKEND_BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    networks:
      - fairplay

  migrate:
    build:
      context: .
      target: migrator
    image: fairplay-backend-migrator:local
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-fairplay}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fairplay

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-fairplay}
    ports:
      - '${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fairplay

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_BIND_ADDRESS:-127.0.0.1}:6379:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fairplay

  object-storage:
    image: dxflrs/garage@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_ACCESS_KEY: ${COMPOSE_OBJECT_STORAGE_ACCESS_KEY:-fairplay}
      GARAGE_DEFAULT_SECRET_KEY: ${COMPOSE_OBJECT_STORAGE_SECRET_KEY:-fairplay-local-secret}
      GARAGE_DEFAULT_BUCKET: ${COMPOSE_OBJECT_STORAGE_BUCKET:-user-media}
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    ports:
      - '${OBJECT_STORAGE_BIND_ADDRESS:-127.0.0.1}:9000:3900'
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - object_storage_data:/var/lib/garage
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fairplay

networks:
  fairplay:
    name: fairplay-backend-network

volumes:
  postgres_data:
  redis_data:
  object_storage_data:
