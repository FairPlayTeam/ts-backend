services:
  backend:
    build:
      context: .
      target: runtime
    image: fairplay-backend:local
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-fairplay}?schema=public
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      JSON_BODY_LIMIT_BYTES: ${JSON_BODY_LIMIT_BYTES:-1048576}
      SESSION_CLEANUP_INTERVAL_MINUTES: ${SESSION_CLEANUP_INTERVAL_MINUTES:-60}
      SESSION_CLEANUP_INACTIVE_RETENTION_DAYS: ${SESSION_CLEANUP_INACTIVE_RETENTION_DAYS:-30}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:-local-compose-rate-limit-secret-7f4d2c1b9a8063e5}
      AUTH_CODE_PEPPER: ${AUTH_CODE_PEPPER:-local-compose-auth-code-pepper-4f9e1a7b2c8d0e6f}
      OBJECT_STORAGE_ENDPOINT: ${COMPOSE_OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_PUBLIC_URL: ${COMPOSE_OBJECT_STORAGE_PUBLIC_URL:-http://localhost:9000}
      OBJECT_STORAGE_REGION: ${COMPOSE_OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${COMPOSE_OBJECT_STORAGE_BUCKET:-fairplay-user-media}
      OBJECT_STORAGE_ACCESS_KEY: ${COMPOSE_OBJECT_STORAGE_ACCESS_KEY:-fairplay}
      OBJECT_STORAGE_SECRET_KEY: ${COMPOSE_OBJECT_STORAGE_SECRET_KEY:-fairplay-minio-secret}
      OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS: ${COMPOSE_OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS:-900}
      PROFILE_MEDIA_MAX_UPLOAD_BYTES: ${PROFILE_MEDIA_MAX_UPLOAD_BYTES:-3145728}
    ports:
      - '${BACKEND_BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - fairplay

  migrate:
    build:
      context: .
      target: migrator
    image: fairplay-backend-migrator:local
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-fairplay}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fairplay

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-fairplay}
    ports:
      - '${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fairplay

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_BIND_ADDRESS:-127.0.0.1}:6379:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fairplay

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${COMPOSE_OBJECT_STORAGE_ACCESS_KEY:-fairplay}
      MINIO_ROOT_PASSWORD: ${COMPOSE_OBJECT_STORAGE_SECRET_KEY:-fairplay-minio-secret}
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '${MINIO_API_BIND_ADDRESS:-127.0.0.1}:9000:9000'
      - '${MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/ready >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fairplay

networks:
  fairplay:
    name: fairplay-backend-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
