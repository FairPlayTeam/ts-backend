name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/fairplay?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Check Prisma format
        run: bunx prisma format --check

      - name: Run checks
        run: bun run check

      - name: Build runtime Docker image
        run: docker build --target runtime --tag fp-backend:ci-runtime .

      - name: Build migrator Docker image
        run: docker build --target migrator --tag fp-backend:ci-migrator .
